name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/prettier.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/prettier.yml"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # removed md files that include liquid tags
          args: >-
            --user-agent 'curl/7.54'
            --base https://aai-research-lab.github.io
            --exclude 'linkedin\.com'
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude 'doi\.org|onlinelibrary\.wiley\.com|pubs\.acs\.org'
            --max-retries 2
            --exclude-path _pages/404.md
            --exclude-path al-folio_README.md
            --exclude-path al-folio_CONTRIBUTING.md
            --exclude-path CUSTOMIZE.md
            --exclude-path FAQ.md
            --exclude-path INSTALL.md
            --verbose --no-progress './**/*.md' './**/*.html'
